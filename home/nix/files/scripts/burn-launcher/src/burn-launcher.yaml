# burn-launcher model catalog
# Categories are for the interactive menu only.

models:
  vision:
    - name: "burn/mnist-demo"
      description: "Built-in MNIST digit recognition demo"
      engine: "burn-native"
  general:
    - name: "huggingface/TinyLlama-1.1B-Chat-v1.0"
      description: "Direct Burn inference for Llama models"
      engine: "burn-llama"
    - name: "gemma4-2b-it"
      description: "[Coming Soon] Translated Burn-compatible Gemma 4"
      engine: "burn-gemma4"
  classification:
    - name: "distilbert-base-uncased-finetuned-sst-2-english"
      description: "Sentiment Analysis via Burn text-classification"
      engine: "burn-bert"
  voice:
    - name: "onnx/voice-placeholder"
      description: "[Coming Soon] Execution of ONNX Voice models using Burn's ONNX import"
      engine: "burn-onnx"
