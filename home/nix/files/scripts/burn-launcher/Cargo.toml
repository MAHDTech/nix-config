[package]
name = "burn-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { version = "0.20.1", features = ["wgpu", "ndarray", "vision"] }
burn-wgpu = "0.20.1"
ratatui = "0.30.0"
crossterm = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.33"
clap = { version = "4.6.0", features = ["derive"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "blocking", "json"] }
indicatif = "0.18.4"
