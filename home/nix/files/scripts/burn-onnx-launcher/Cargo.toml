[package]
name = "burn-onnx-launcher"
version = "0.1.0"
edition = "2021"
description = "Headless & TUI launcher for ONNX-imported Burn models (Gemma 4 prototype)"

[[bin]]
name = "burn-onnx-launcher"
path = "src/main.rs"

[dependencies]
# Burn framework (WebGPU backend for multi-vendor GPU)
burn = { workspace = true }

# CLI
clap = { workspace = true }

# Config
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# HTTP server
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
log = { workspace = true }

# HuggingFace Hub (model downloads)
hf-hub = { workspace = true }

# System detection
sysinfo = { workspace = true }

# TUI
ratatui = { workspace = true }
crossterm = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tokio-stream = { workspace = true }

# burn-onnx is used by the convert tool to generate code
burn-onnx = { path = "/home/mahdtech/Sync/Projects/GitHub/tars-cloud/_PM_/research/gemma4/repos/burn-onnx/crates/burn-onnx" }
