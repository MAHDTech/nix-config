[package]

name = "burn-lm-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]

burn = { workspace = true }

# burn-lm crates
burn-lm-http = "0.0.1"
burn-lm-inference = "0.0.1"
burn-lm-registry = "0.0.1"

# Direct Axum deps for custom debug router (bypasses upstream App::serve)
axum = "0.8"
tower-http = { version = "0.6", features = ["request-id", "trace", "util"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"

# TUI & System Dependencies
clap = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
hf-hub = { workspace = true }
indicatif = { workspace = true }
log = { workspace = true }
ratatui = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa-swagger-ui = { workspace = true }
