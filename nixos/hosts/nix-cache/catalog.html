<section class="panel" aria-labelledby="catalog-title">
  <h2 class="panel-title" id="catalog-title">CACHED DOWNLOADS</h2>
  <noscript><p>JavaScript is required to browse the cached download catalog.</p></noscript>
  <p class="muted" id="catalog-status" role="status">Loading catalog…</p>
  <p class="muted">Snapshot of cached files. Evicted items are fetched from upstream on demand.</p>
  <div class="catalog-controls">
    <label class="search-field"
      >Search packages or archives<input
        id="catalog-search"
        type="search"
        placeholder="Package name or archive hash"
    /></label>
    <label
      >Upstream<select id="catalog-upstream">
        <option value="">All upstreams</option>
      </select></label
    >
    <label
      >File type<select id="catalog-kind">
        <option value="archive">Archives</option>
        <option value="">All files</option>
        <option value="metadata">Package metadata</option>
      </select></label
    >
  </div>
  <div class="table-scroll">
    <table class="file-table">
      <thead>
        <tr>
          <th>Name / download</th>
          <th>Upstream</th>
          <th>Size</th>
          <th>Type</th>
        </tr>
      </thead>
      <tbody id="catalog-rows"></tbody>
    </table>
  </div>
  <div class="catalog-controls">
    <button id="catalog-previous" type="button" disabled>
      <span aria-hidden="true">←</span> Previous
    </button>
    <span class="muted" id="catalog-page" role="status"></span>
    <button id="catalog-next" type="button" disabled>Next <span aria-hidden="true">→</span></button>
  </div>
</section>
