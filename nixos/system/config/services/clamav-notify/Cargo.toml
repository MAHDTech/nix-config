[package]

name = "clamav-notify"
version = "0.1.0"
edition = "2024"
description = "ClamAV notification daemon, inbox, and TUI for NixOS"
license = "MIT"

[dependencies]

chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

