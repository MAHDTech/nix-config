[default]

locale = "en-au"

extend-ignore-re = [
    "^[ \t]*-----BEGIN PGP PUBLIC KEY BLOCK-----.*^[ \t]*-----END PGP PUBLIC KEY BLOCK-----",
    # Ignore current line with spellchecker:ignore-line (HTML comments)
    "(?Rm)^.*<!--.*spellchecker:ignore-line.*-->.*$",
    # Ignore current line with spellchecker:ignore-line (bash/shell/C comments)
    "(?Rm)^.*(#|//)\\s*spellchecker:ignore-line\\s*$",
    # Ignore next line after spellchecker:ignore-next-line (HTML comments)
    "(?s)<!--\\s*spellchecker:ignore-next-line\\s*-->[^\\n]*\\n[^\\n]*",
    # Ignore next line after spellchecker:ignore-next-line (bash/shell comments)
    "(?s)#\\s*spellchecker:ignore-next-line[^\\n]*\\n[^\\n]*",
    # Ignore next line after spellchecker:ignore-next-line (C-style comments)
    "(?s)//\\s*spellchecker:ignore-next-line[^\\n]*\\n[^\\n]*"
]

[default.extend-words]

ags = "ags"
analyzer = "analyzer"
authorised = "authorised"
authorization = "authorization"
authorizations = "authorizations"
authorized = "authorized"
center = "center"
cros = "cros"
customizations = "customizations"
guage = "guage"
hashi = "hashi"
hashicorp = "hashicorp"
hda = "hda"
initialize = "initialize"
initialized = "initialized"
initializing = "initializing"
maximize = "maximize"
monitord = "monitord"
nce = "nce"
normalization = "normalization"
optimizations = "optimizations"
optimized = "optimized"
organization = "organization"
organizations = "organizations"
organize = "organize"
personalization = "personalization"
randomize = "randomize"
randomized = "randomized"
recognize = "recognize"

[files]

ignore-vcs = true

extend-exclude = [
  "*.drawio",
  ".devenv",
  ".direnv",
  ".git",
  "secrets",
  "vendor"
]
