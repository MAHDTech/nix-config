---
name: Nix Flake check

on:
  push:
    branches:
      - trunk

  pull_request:
    branches:
      - "trunk"

permissions:
  contents: read

env:
  NIXPKGS_ALLOW_INSECURE: 1
  NIXPKGS_ALLOW_UNFREE: 1
  NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1

jobs:
  nix:
    runs-on: ubuntu-latest

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_qemu
        name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - id: install_nix
        name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-platforms = aarch64-linux

      - id: enable_cachix
        name: "Enable Cachix ❄️"
        uses: cachix/cachix-action@v17
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: true
          skipPush: false

      - id: test_devenv
        name: Test Devenv
        run: >-
          nix develop
          --accept-flake-config
          --impure
          .#default
          --command
          devenv test

      - id: check_vm_tests
        name: Check Flake VM Tests
        run: |
          FAILED_CHECKS=()
          for CHECK in $(nix flake show --json 2>/dev/null | jq -r '.checks."x86_64-linux" // {} | keys[]'); do
            echo "::group::Running VM test $CHECK"
            if ! nix build .#checks.x86_64-linux."$CHECK" --accept-flake-config --impure --no-link; then
              echo "::error::Failed VM test $CHECK"
              FAILED_CHECKS+=("$CHECK")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED_CHECKS[@]} -gt 0 ]; then
            echo "The following VM tests failed: ${FAILED_CHECKS[*]}"
            exit 1
          fi

      - id: check_home_manager
        name: Check Home Manager
        run: |
          FAILED_HM=()
          for SYSTEM in x86_64-linux aarch64-linux; do
            echo "::group::Checking Home Manager ($SYSTEM)"
            if ! nix eval .#homeConfigurations."$SYSTEM".mahdtech.activationPackage.drvPath --accept-flake-config --impure; then
              echo "::error::Failed Home Manager evaluation for $SYSTEM"
              FAILED_HM+=("$SYSTEM")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED_HM[@]} -gt 0 ]; then
            echo "Home Manager failed for: ${FAILED_HM[*]}"
            exit 1
          fi

      - id: check_nixos_hosts
        name: Check NixOS Hosts
        run: |
          FAILED_HOSTS=()
          HOSTS=$(nix flake show --json 2>/dev/null | jq -r '.nixosConfigurations | keys[]')
          for HOST in $HOSTS; do
            echo "::group::Checking NixOS host $HOST"
            if ! nix eval .#nixosConfigurations."$HOST".config.system.build.toplevel.drvPath --accept-flake-config --impure; then
              echo "::error::Failed evaluating NixOS host $HOST"
              FAILED_HOSTS+=("$HOST")
            fi
            echo "Finished checking NixOS host $HOST"
            echo "::endgroup::"
          done
          if [ ${#FAILED_HOSTS[@]} -gt 0 ]; then
            echo "The following NixOS hosts failed evaluation: ${FAILED_HOSTS[*]}"
            exit 1
          fi

      - id: check_statix
        name: Check Statix
        run: nix run nixpkgs#statix -- check
