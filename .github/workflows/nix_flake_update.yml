---
name: Nix Flake update

on:
  schedule:
    - cron: "0 0 * * 0"

  workflow_dispatch:

permissions:
  contents: write
  packages: read
  pull-requests: write
  statuses: read

env:
  NIXPKGS_ALLOW_UNFREE: 1

jobs:
  nix:
    runs-on: ubuntu-latest

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          lfs: false
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: install_nix
        name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true

      - id: enable_cachix
        name: "Enable Cachix ❄️"
        uses: cachix/cachix-action@v16
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: true
          skipPush: false

      - id: update_flake_lock
        name: Update Flake Lock
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          token: ${{ secrets.MAHDTECH_TOKEN_CREATE_PR }}
          sign-commits: false
          #gpg-fingerprint: ${{ secrets.GPG_FINGERPRINT }}
          #gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          #gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          git-author-email: "github-actions@users.noreply.github.com"
          git-author-name: "Nix Flake Bot"
          git-committer-email: "github-actions@users.noreply.github.com"
          git-committer-name: "Nix Flake Bot"
          pr-title: "Update flake.lock"
          nix-options: --accept-flake-config

      - id: print_pr_number
        name: Print PR Number
        run: |
          echo PR number: ${{ steps.update_flake_lock.outputs.pull-request-number }}
