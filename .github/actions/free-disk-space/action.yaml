---
name: Free Disk Space
description: Remove pre-installed Ubuntu runner packages to free disk space for Nix/devenv.

runs:
  using: composite
  steps:
    - id: free_disk_space
      name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: >-
          /usr/share/swift
          /usr/share/miniconda
          /usr/share/az*
          /usr/local/lib/node_modules
          /usr/local/share/chromium
          /usr/local/share/powershell
          /usr/local/julia
          /usr/local/aws-cli
          /usr/local/aws-sam-cli
          /usr/share/gradle
        rm_cmd: "rmz"
        rmz_version: "3.1.1"

    - id: setup_swap
      name: Ensure Adequate Swap Space for Flake Evaluation
      shell: bash
      run: |
        sudo systemctl stop systemd-oomd || true
        sudo systemctl mask systemd-oomd || true
        sudo swapoff -a || true
        sudo rm -f /swapfile /mnt/swapfile || true
        SWAP_DIR="/mnt"
        if [ ! -d "$SWAP_DIR" ]; then
          SWAP_DIR=""
        fi
        AVAIL_MB=$(df -m "${SWAP_DIR:-/}" | awk 'NR==2 {print $4}')
        TARGET_MB=$(( AVAIL_MB - 10240 ))
        if [ "$TARGET_MB" -gt 32768 ]; then
          TARGET_MB=32768
        elif [ "$TARGET_MB" -lt 8192 ]; then
          TARGET_MB=8192
        fi
        SWAP_FILE="${SWAP_DIR}/swapfile"
        echo "Configuring ${TARGET_MB}M swapfile at $SWAP_FILE (available: ${AVAIL_MB}M)..."
        # cspell:ignore fallocate swapoff oomd
        sudo fallocate -l "${TARGET_MB}M" "$SWAP_FILE" || sudo dd if=/dev/zero of="$SWAP_FILE" bs=1M count="$TARGET_MB"
        sudo chmod 600 "$SWAP_FILE"
        sudo mkswap "$SWAP_FILE"
        sudo swapon "$SWAP_FILE"
        free -h
